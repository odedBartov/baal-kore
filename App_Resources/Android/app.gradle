// Native dependencies for the Java helpers in src/main/java (see docs/architecture.md).
dependencies {
  // On-device CTC model for word checks (MIT). The model itself is an optional asset: npm run fetch-model.
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.0'
  // Google Play In-App Billing SDK v8 for ₪10 per-Parasha unlock (Aliyot 2–7).
  implementation 'com.android.billingclient:billing:8.0.0'
}

def isAabBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains("bundle") }

android {
  compileSdkVersion 36
  buildToolsVersion "36"

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 36

    // Version Information
    versionCode 9
    versionName "1.0.3"

    generatedDensities = []

    // ponytail: 64-bit ARM phones + x86_64 emulator only; add 'armeabi-v7a' if old 32-bit phones matter.
    // abiFilters is additive and NativeScript pre-fills all four ABIs, so replace the set.
    ndk { abiFilters.clear(); abiFilters 'arm64-v8a', 'x86_64' }
  }

  buildTypes {
    release {
      minifyEnabled true
      shrinkResources false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), file("$rootDir/../../App_Resources/Android/proguard-rules.pro")
    }
  }

  aaptOptions {
    additionalParameters "--no-version-vectors"
    // Stored, not deflated: the model is copied out by file descriptor, Ogg is already compressed.
    noCompress 'onnx', 'oga', 'ogg'
    if (isAabBuild) {
      // When building an .aab for Google Play, the 415 MB ONNX models are delivered via the :model_assets
      // install-time Play Asset Delivery pack so the base module stays ~45 MB (well under the 200 MB limit).
      ignoreAssetsPattern "models"
    }
  }

  if (isAabBuild) {
    assetPacks = [":model_assets"]
  }
}

if (isAabBuild) {
  // Point the install-time asset pack at the models/ folder so it isn't duplicated on disk.
  tasks.matching { it.name.toLowerCase().contains("bundle") }.configureEach {
    doFirst {
      def srcModels = file("$rootDir/../../App_Resources/Android/src/main/assets/models")
      def dstModels = file("$rootDir/../../App_Resources/Android/model_assets/src/main/assets/models")
      if (srcModels.exists() && !dstModels.exists()) {
        dstModels.parentFile.mkdirs()
        ant.copy(todir: dstModels) {
          fileset(dir: srcModels)
        }
      }
    }
  }
}
